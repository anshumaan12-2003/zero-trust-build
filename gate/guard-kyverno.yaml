# Keeps the gate from being switched off by accident or by someone below
# cluster admin. Kyverno deletes its own webhooks when its admission controller
# is scaled to 0 or deleted, which opens the gate (Week 8). This refuses both.
#
# It is a built-in ValidatingAdmissionPolicy, so it doesn't depend on Kyverno.
# A cluster admin can still remove the binding first. That is deliberate and
# leaves an audit record, and the ZTBGateDown alert still fires.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztb-guard-kyverno
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kyverno
    resourceRules:
      - apiGroups: ['apps']
        apiVersions: ['v1']
        resources: ['deployments', 'deployments/scale']
        resourceNames: ['kyverno-admission-controller']
        operations: ['UPDATE', 'DELETE']
  validations:
    - expression: request.operation != 'DELETE'
      message: "Kyverno's admission controller can't be deleted while the gate guard is on"
    - expression: request.operation == 'DELETE' || object.spec.?replicas.orValue(1) >= 1
      message: "Kyverno's admission controller can't be scaled below 1 while the gate guard is on"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztb-guard-kyverno
spec:
  policyName: ztb-guard-kyverno
  validationActions: [Deny]
