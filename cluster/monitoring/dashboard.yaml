# The Grafana dashboard for the gate. Grafana's sidecar loads any ConfigMap
# with the grafana_dashboard label from the monitoring namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ztb-gate-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ztb-gate.json: |
    {
      "uid": "ztb-gate",
      "title": "Zero Trust Build: gate decisions",
      "tags": [
        "ztb"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods allowed by the gate",
          "description": "App pods with a valid signature and a passing behaviour record, over the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kyverno_image_validating_policy_results_total{policy_name=\"require-build-attestation\", result=\"pass\"}[$__range])) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods refused by the gate",
          "description": "App pods refused because the image had no signature, no record, or a record that did not say pass.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kyverno_image_validating_policy_results_total{policy_name=\"require-build-attestation\", result=\"fail\"}[$__range])) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              },
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Gate errors",
          "description": "Checks that couldn't finish, for example when the registry or transparency log was unreachable. failurePolicy: Fail refuses these too.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kyverno_image_validating_policy_results_total{policy_name=\"require-build-attestation\", result=\"error\"}[$__range])) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              },
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Kyverno admission controllers up",
          "description": "0 means the gate may be open (scaled to 0) or closed to everything (crashed). See the ZTBGateDown alert.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{namespace=\"kyverno\", service=\"kyverno-svc-metrics\"}) or vector(0)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Gate decisions per minute",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (result) (rate(kyverno_image_validating_policy_results_total{policy_name=\"require-build-attestation\"}[2m])) * 60",
              "legendFormat": "{{result}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "pass"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "fail"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Refusals by namespace",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (resource_namespace) (increase(kyverno_image_validating_policy_results_total{policy_name=\"require-build-attestation\", result=\"fail\"}[$__range])) > 0",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "resource_namespace": "Namespace",
                  "Value": "Refused"
                }
              }
            }
          ]
        }
      ]
    }
