# Rules for one build. The judge (ztb/judge.py) reads this file with Python's
# built-in tomllib, so it needs no third-party packages.

[network]
# Week 5's proxy will allow only these domains.
allowed_domains = ["registry.npmjs.org"]

[processes]
# Programs that should never run during this build.
denied = ["*/curl", "*/wget", "*/nc", "*/ncat", "*/socat"]

# Programs seen in every clean build. Week 4 (run 42664568807) found six.
# Week 5's sandbox (run 42665549829) added grep and id, used by build-steps.sh.
known = [
  "/tmp/work/node_modules/.bin/tsc",
  "/usr/bin/cp",
  "/usr/bin/grep",
  "/usr/bin/id",
  "/usr/bin/sh",
  "/usr/local/bin/docker-entrypoint.sh",
  "/usr/local/bin/node",
  "/usr/local/bin/npm",
]

# What to do about a program not in the known list: "warn" or "fail".
# "fail" since Week 10: 20 clean builds on fresh runners raised no PROC-2
# warning (measure.yml run 42798034833). A new build tool now needs a policy
# change, reviewed like code, before it can run.
unknown_action = "fail"

[files]
decoys = ["*/.aws/credentials", "*/.ssh/id_rsa", "*/.config/gh/hosts.yml"]
process_secrets = ["*/environ", "*/mem"]

[sensor]
# Tetragon v1.8.0 counters for events the sensor dropped or never saw.
# stop-sensor.sh saves them to sensor/metrics.prom. The judge fails the build
# (SENSOR-5) if any is above zero, or if none is in the evidence.
lost_event_counters = [
  "tetragon_observer_ringbuf_events_lost_total",
  "tetragon_observer_ringbuf_queue_events_lost_total",
  "tetragon_missed_prog_probes_total",
  "tetragon_missed_link_probes_total",
]
