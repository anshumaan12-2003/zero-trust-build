name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job starts with no permissions and asks only for what it needs.
permissions: {}

# A newer push to the same pull request cancels the older run.
# Runs on main are never cancelled. Images are built and signed by pipeline.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test the app
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the code
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: node --version
      - run: npm ci
      - run: npm test

  test-judge:
    name: Test the judge
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the code
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 --version
      - run: python3 -m unittest discover -s tests -v

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the workflow files
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline --persona=pedantic .github/workflows
      # Every action's commit is recorded in .github/workflows/actions.lock, and
      # GitHub's runner refuses an action whose tag no longer matches it. This
      # also fails the PR if a workflow uses an action the lockfile doesn't cover.
      - name: Check the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
