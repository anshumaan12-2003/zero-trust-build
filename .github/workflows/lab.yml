name: attack-lab

# The attack lab: run each harmless scenario against the real sandbox, sensor
# and judge, and check the verdict against what lab/expected.toml predicts.
# Started by hand, or on a change to lab/. One job per scenario, so a miss in
# one never hides a miss in another. The release job is never involved.

on:
  pull_request:
    paths:
      - 'lab/**'
      - '.github/workflows/lab.yml'
  workflow_dispatch:
    inputs:
      flakiness_runs:
        description: 'How many times to repeat the clean build for the false-alarm rate'
        required: false
        default: '20'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the code and the scenarios
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - B1
          - B3
          - B4
          - B5
          - M1
          - M2
          - M3
          - M4
          - M5
          - M6
          - M7
          - M8
          - M9
          - M10
          - M11
          - M12
          - S3
          - S4
          - S5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: lab/run-scenario.sh "$SCENARIO"
      - name: Check it behaved as documented
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: python3 lab/assert.py "$SCENARIO" out/report/verdict.json lab/expected.toml
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error

  # B6: the clean build repeated, to measure how often it raises a false alarm.
  # Manual only, because it is slow.
  flakiness:
    name: Clean-build false-alarm rate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repeat the clean build
        env:
          RUNS: ${{ inputs.flakiness_runs }}
        run: |
          runs="${RUNS:-20}"
          fail=0
          for i in $(seq 1 "$runs"); do
            lab/run-scenario.sh B1 > /dev/null 2>&1 || true
            if python3 lab/assert.py B1 out/report/verdict.json lab/expected.toml > /dev/null 2>&1; then
              echo "run $i: pass"
            else
              echo "run $i: FALSE ALARM"
              fail=$((fail + 1))
            fi
          done
          echo "False alarms: $fail / $runs"
          echo "False alarms: $fail / $runs" >> "$GITHUB_STEP_SUMMARY"
          test "$fail" -eq 0
