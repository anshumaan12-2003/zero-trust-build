name: attack-lab

# The attack lab: run each harmless scenario against the real sandbox, sensor
# and judge, and check the verdict against what lab/expected.toml predicts.
# Started by hand, or on a change to lab/. One job per scenario, so a miss in
# one never hides a miss in another. The release job is never involved.
# B6 (the clean build repeated) is measure.yml's 20-run false-alarm matrix.

on:
  pull_request:
    paths:
      - 'lab/**'
      - '.github/workflows/lab.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the code and the scenarios
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - B1
          - B3
          - B4
          - B5
          - M1
          - M2
          - M3
          - M4
          - M5
          - M6
          - M7
          - M8
          - M9
          - M10
          - M11
          - M12
          - S3
          - S4
          - S5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run the scenario
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: lab/run-scenario.sh "$SCENARIO"
      - name: Check it behaved as documented
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: python3 lab/assert.py "$SCENARIO" out/report/verdict.json lab/expected.toml
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lab-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: error
