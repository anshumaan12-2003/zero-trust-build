name: secrets

# Scans every commit in the repo's history for committed secrets with gitleaks.
# The only allowed matches are the labelled fake decoys (see .gitleaks.toml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan the whole history for secrets
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the full history
    env:
      GITLEAKS_VERSION: 8.30.1 # 21 March 2026
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks and check its checksum
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan every commit
        run: |
          echo "Commits to scan: $(git rev-list --all --count)"
          gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
