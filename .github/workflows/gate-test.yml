name: gate-test

on:
  pull_request:
    paths:
      - 'gate/**'
      - '.github/workflows/gate-test.yml'
  workflow_dispatch:
    inputs:
      good_image:
        description: 'An image signed by pipeline.yml on main (leave empty for gate/good-image.txt)'
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Test the Kubernetes gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the policy and tests
    env:
      KYVERNO_CHART: 3.9.2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Show tool versions
        run: |
          kind version
          kubectl version --client
          helm version --short
      - name: Create the cluster
        run: kind create cluster --config gate/kind-config.yaml --wait 120s
      - name: Install Kyverno
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm install kyverno kyverno/kyverno --namespace kyverno --create-namespace \
            --version "$KYVERNO_CHART" --wait --timeout 5m
          kubectl get deployments -n kyverno
      - name: Show the cosign fields this Kyverno accepts
        run: kubectl explain imagevalidatingpolicy.spec.attestors.cosign --recursive
      - name: Apply the gate
        run: |
          kubectl apply -f gate/require-attestation.yaml
          kubectl get imagevalidatingpolicy require-build-attestation -o yaml | sed -n '/^status:/,$p'
      - name: Try images against the gate
        env:
          GOOD_INPUT: ${{ inputs.good_image }}
        run: |
          good="${GOOD_INPUT:-$(cat gate/good-image.txt)}"
          if ! [[ "$good" =~ ^ghcr\.io/anshumaan12-2003/zero-trust-build-app@sha256:[0-9a-f]{64}$ ]]; then
            echo "Not an app image by digest: $good" >&2
            exit 1
          fi
          gate/test-gate.sh "$good"
      - name: Show Kyverno's log
        if: failure()
        run: kubectl logs -n kyverno deployment/kyverno-admission-controller --tail 60
