name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build in the sandbox with the sensor on
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start sensor
        run: sensor/start-sensor.sh
      - name: Run build in sandbox
        run: sandbox/run-build.sh
      - name: Stop sensor
        if: always()
        run: sensor/stop-sensor.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: out/
          if-no-files-found: error

  # A fresh machine that never runs build code. It reads only the evidence.
  judge:
    name: Judge the build evidence
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the judge and the policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
          path: evidence/
      - name: Judge
        run: python3 ztb/judge.py --evidence evidence --policy policy/build-policy.toml --output report
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict
          path: report/
          if-no-files-found: error

  # The only job that can sign. It runs after the judge passes, never runs
  # build code, and assembles the image with COPY only.
  # Pull requests never reach it. A manual run on a branch can, for testing,
  # but its certificate names that branch, so the gate (Week 8) refuses it.
  release:
    name: Sign and publish the image
    needs: judge
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the release Dockerfile
      packages: write # push the image and its signatures
      id-token: write # get a short-lived signing certificate from Sigstore
    env:
      IMAGE: ghcr.io/anshumaan12-2003/zero-trust-build-app
      PREDICATE_TYPE: https://in-toto.io/attestation/runtime-trace/v0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence
          path: evidence/
      - name: Download verdict
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verdict
          path: report/
      - name: Check the verdict covers this exact build output
        run: |
          jq -e '.verdict == "pass"' report/verdict.json
          judged="$(jq -r .ztb.distSha256 report/predicate.json)"
          actual="$(sha256sum evidence/dist.tar | cut -d' ' -f1)"
          echo "judged $judged"
          echo "actual $actual"
          test "$judged" = "$actual"
      - name: Unpack the build output safely
        run: python3 release/unpack.py evidence/dist.tar context
      - name: Assemble the image with COPY only
        run: docker build -f release/Dockerfile -t "$IMAGE:$GITHUB_SHA" context
      - name: Smoke test the image
        run: |
          docker run -d --rm --name smoke -p 3000:3000 --read-only --cap-drop=ALL "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 20); do
            if curl -fsS localhost:3000/health; then break; fi
            sleep 1
          done
          curl -fsS localhost:3000/health
          docker stop smoke
      - name: Push the image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")"
          echo "Pushed $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign the image and attach the behaviour attestation
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type "$PREDICATE_TYPE" --predicate report/predicate.json "$REF"
      - name: Verify both, as the gate will
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/pipeline.yml@$GITHUB_REF"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$REF" > /dev/null
          cosign verify-attestation --type "$PREDICATE_TYPE" \
            --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$REF" \
            | jq -r '.payload | @base64d | fromjson | .predicate.ztb | "Signed verdict: \(.verdict), dist \(.distSha256)"'
          echo "### Released" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REF\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io

  escape-test:
    name: Try to escape the sandbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make a copy of the app with a harmless escape script
        run: |
          cp -r app "$RUNNER_TEMP/escape-app"
          cp sandbox/experiments/escape.js "$RUNNER_TEMP/escape-app/"
          cd "$RUNNER_TEMP/escape-app"
          npm pkg set scripts.postinstall="node escape.js"
      - name: Start sensor
        run: sensor/start-sensor.sh
      - name: Run the escape build in the sandbox
        run: APP_DIR="$RUNNER_TEMP/escape-app" sandbox/run-build.sh
      - name: Stop sensor
        if: always()
        run: sensor/stop-sensor.sh
      - name: Check that every attempt was blocked and recorded
        run: sandbox/experiments/check-escape.sh
      - name: Check that the judge fails the escape build for each attempt
        run: |
          if python3 ztb/judge.py --evidence out --policy policy/build-policy.toml --output out/report; then
            echo "The judge passed a build that tried to escape." >&2
            exit 1
          fi
          jq -e '[.findings[].rule] | sort == ["FILE-1", "NET-1", "NET-2"]' out/report/verdict.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escape-evidence
          path: out/
          if-no-files-found: error
