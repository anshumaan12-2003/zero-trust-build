# The demo app on Kubernetes. Argo CD syncs this folder (cluster/argocd/app.yaml).
# The container settings match the locking flags tested in Week 1: non-root,
# no capabilities, read-only. The image is pinned by digest to a build signed
# by pipeline.yml on main, the same one as gate/good-image.txt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ztb-app
  labels:
    app: ztb-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ztb-app
  template:
    metadata:
      labels:
        app: ztb-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/anshumaan12-2003/zero-trust-build-app@sha256:d5cd49a905893b013aaf5904ccf07260c7b3a6cfc2a2c9bc2ce49c08673a3a3a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ztb-app
spec:
  selector:
    app: ztb-app
  ports:
    - port: 80
      targetPort: 3000
